  properties:
  - url: https://www.subbly.co/product
    type: Documentation
  - url: https://www.subbly.co/all-features
    type: Documentation
  description: >-
    In-app webhook platform that notifies external and internal services of Subbly events (order and subscription
    lifecycle) with configurable conditions and variables. Webhooks are configured in the Subbly admin
    rather than via a published subscription API, and Subbly does not publish a formal event catalog or
    payload schema, so no webhook schemas are modeled here.
