specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Subbly
providerId: subbly
created: '2026-07-10'
modified: '2026-07-10'
reconciled: false
tags:
- Subscriptions
- Subscription Commerce
- Ecommerce
- Recurring Billing
- Plans
description: >-
  Subbly is priced as a SaaS subscription-commerce platform, not as a metered
  API. Merchants pay a monthly platform fee per plan tier, plus a Subbly
  transaction fee taken as a percentage of each processed transaction, on top of
  the underlying payment processor's fees (Stripe, PayPal/Braintree, Auth.net).
  The developer surface - SubblyCart.js, the Subbly.js SDK, the public Orders
  API, and webhooks - is included with the platform subscription and is not
  separately metered or billed. Annual billing is discounted (roughly 25% off,
  described by Subbly as about three months free).
notes: >-
  Prices below are grounded in the Subbly pricing page and the pricing/transaction
  fee help-center article as of 2026-07-10 and may change - verify at
  https://www.subbly.co/pricing during reconciliation. Monthly figures are the
  standard month-to-month rate; the annual-billing effective monthly rate is
  noted per tier. Subbly transaction fees are in addition to payment-processor
  fees. Some tiers also carry a small fixed per-transaction component
  (for example +$0.19 on Lite, +$0.15 on higher tiers) per the pricing page.
sources:
- https://www.subbly.co/pricing
- https://support.subbly.co/faq/pricing-structure-and-applicable-transaction-fees-on-subbly
- https://www.subbly.co/lite-plan
