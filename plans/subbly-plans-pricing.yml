    name: platform_fee
    type: flat
    metric: subscription
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: $19/month (or ~$14.25/month billed annually)
    userMultiplied: false
  - label: Subbly Transaction Fee (Stripe)
    name: txn_fee_stripe
