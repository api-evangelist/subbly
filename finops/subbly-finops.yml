meters:
- name: platform_fee
  description: Fixed monthly platform fee for the selected Subbly plan tier.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: transaction_fee
  description: Subbly transaction fee taken as a percentage of each processed transaction, on top of payment-processor fees.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - processor
  - plan
principles:
- name: Visibility
  description: Track the fixed platform fee separately from the percentage transaction fee, and separate both from the underlying payment-processor fees.
- name: Allocation
  description: Attribute transaction-fee spend to product lines or storefronts by tagging orders and subscriptions in the Subbly admin.
- name: Optimization
  description: Move to annual billing to cut the platform fee, and step up plan tiers (or to Subbly X) as volume grows since higher tiers carry lower transaction-fee percentages.
- name: Accountability
  description: Review monthly platform plus transaction fees against processed subscription revenue to keep effective take-rate in view.
