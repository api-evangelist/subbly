description: >-
  FinOps view of Subbly spend. Subbly bills as a SaaS subscription-commerce
  platform: a fixed monthly platform fee per plan tier plus a Subbly transaction
  fee taken as a percentage of each processed transaction, on top of the
  underlying payment processor's fees (Stripe, PayPal/Braintree, Auth.net). The
  developer surface (SubblyCart.js, the Subbly.js SDK, the Orders API, and
  webhooks) is included in the platform subscription and is not separately
  metered. The dominant variable cost is the transaction fee, so cost scales
  with processed order/subscription volume; annual billing lowers the fixed
  platform fee by roughly 25%.
notes: >-
  Per-unit rates are grounded in the Subbly pricing page as of 2026-07-10 and
  may change; verify at https://www.subbly.co/pricing. Total cost of processing
  also includes payment-processor fees that Subbly does not collect. There is no
  usage-metered API charge to model - API access is bundled with the plan.
