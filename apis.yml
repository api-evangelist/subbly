    type: Documentation
  description: >-
    Public Orders API for integrating Subbly orders directly with any third-party logistics (3PL) / fulfillment
    provider. Subbly states it will provide the Orders API documentation on request rather than publishing
    it openly, so this is a real but access-gated API - no endpoints are modeled here because Subbly's
    request/response contract is not publicly documented.
- aid: subbly:subbly-webhooks
  name: Subbly Webhooks
  tags:
  - Webhook
  - Event
  - Automation
  tags_raw:
  - Webhooks
  - Events
  - Automation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
