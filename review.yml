    note: Plan pricing and Subbly transaction fees.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Subbly. Subbly's own API is
    request/response HTTP - a partially documented REST backend behind the
    Subbly.js SDK / SubblyCart.js, an access-gated Orders API for 3PL
    integration, and admin-configured outbound webhooks. No AsyncAPI document
    was created because there is no server-push transport on Subbly's own API to
    model.
